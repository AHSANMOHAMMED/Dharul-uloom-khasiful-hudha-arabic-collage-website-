name: CI

on:
  push:
    branches: [ '**' ]        # every branch, so feature work is proven green before merge
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test --silent
        env:
          CI: true

  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run backend tests
        run: |
          cd backend
          npm test --silent
        env:
          CI: true

  mobile:
    name: Mobile — Expo diagnostics and Android export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Run Expo diagnostics
        run: npx expo-doctor
        working-directory: mobile

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir /tmp/dukh-mobile-export
        working-directory: mobile

  database:
    name: Database — migrations + RLS/ERP tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply all migrations and run security/ERP test suite
        run: bash scripts/testDatabase.sh
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres

  edge-functions:
    name: Edge Functions — deno check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
      - name: Type-check functions
        # Deno's default 24h minimum dependency age can fail CI when a transitive
        # npm package was published recently (seen with ws during seed tooling).
        run: deno check --minimum-dependency-age=0 supabase/functions/*/index.ts
      - name: PayHere crypto unit tests
        run: deno test --minimum-dependency-age=0 supabase/functions/_shared/

  api-latency:
    name: API latency — PostgREST load test (< 10 s budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Seed 2,000-student college, run concurrent load
        run: bash scripts/perf/run.sh --concurrency 30 --requests 1500
