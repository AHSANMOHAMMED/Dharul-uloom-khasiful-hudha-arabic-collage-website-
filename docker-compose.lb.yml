# Self-hosted web tier behind a load balancer.
#   docker compose -f docker-compose.lb.yml up -d --scale frontend=3
# Data/API stays on Supabase (managed, load-balanced; enable read replicas for
# heavy reporting). Point DNS (or a cloud LB / Cloudflare) at this host.
services:
  frontend:
    image: ghcr.io/ahsanmohammed/dharul-uloom-khasiful-hudha-arabic-collage-website--frontend:latest
    restart: always
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 256M

  lb:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
