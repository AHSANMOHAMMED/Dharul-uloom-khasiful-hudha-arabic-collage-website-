version: '3.8'

# Production runs on Supabase (Postgres, Auth, RLS, Edge Functions). The legacy
# Express/Mongo backend in ./backend is deprecated and refuses to start without
# LEGACY_API_ENABLED=1, so it is intentionally not deployed here.
services:
  frontend:
    image: ghcr.io/ahsanmohammed/dharul-uloom-khasiful-hudha-arabic-collage-website--frontend:latest
    restart: always
    ports:
      - "80:80"
