server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Security headers (keep in sync with vercel.json)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com; frame-src 'self' blob: https:; object-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; form-action 'self' https://*.payhere.lk; base-uri 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

  # Never serve dotfiles (.env, .git, etc.)
  location ~ /\. {
    deny all;
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: serve compressed assets if present
  gzip on;
  gzip_types text/plain application/javascript text/css application/json image/svg+xml;
}
