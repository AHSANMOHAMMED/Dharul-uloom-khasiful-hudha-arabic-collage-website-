# Load balancer for self-hosted deployments (docker-compose.lb.yml).
# The data API (Supabase) is load-balanced by Supabase itself; this balances
# the web app replicas and enforces the 10 s request budget at the edge.

upstream web_app {
  least_conn;                                   # send to the least-busy replica
  server frontend:80 max_fails=3 fail_timeout=10s;   # docker DNS resolves every replica
  keepalive 64;
}

limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=connip:10m;

server {
  listen 80;
  server_name _;

  client_max_body_size 20m;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # 10 s end-to-end budget
  proxy_connect_timeout 3s;
  proxy_send_timeout 10s;
  proxy_read_timeout 10s;
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 2;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # fingerprinted build assets: cache for a year at the edge and in browsers
  location /assets/ {
    proxy_pass http://web_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    limit_req zone=perip burst=60 nodelay;
    limit_conn connip 50;
    proxy_pass http://web_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache" always;   # index.html / service worker always fresh
  }
}
